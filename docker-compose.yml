version: '3.8'
services:
  spark-notebook:
    build: .
    image: my-spark-project
    container_name: spark-notebook
    ports:
      - "8888:8888"
      - "4040:4040"
    volumes:
      - .:/home/jovyan/work
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - CHOWN_HOME=yes
      - CHOWN_HOME_OPTS=-R
    command: start-notebook.sh --NotebookApp.token=''

  streamlit-app:
    image: my-spark-project   # ใช้ image เดียวกัน
    container_name: streamlit-app
    ports:
      - "8501:8501"
    volumes:
      - .:/home/jovyan/work
    working_dir: /home/jovyan/work
    command: streamlit run app.py --server.address=0.0.0.0
